<html lang="pt-BR">

  <meta charset="UTF-8">

  <title>Missão Planeta Limpo - Cyber Edition</title>

  <style>

    :root {

      --papel: #00b0ff;

      --plastico: #ff1744;

      --vidro: #00e676;

      --metal: #ffd600;

      --organico: #ff9100;

      --bg-dark: #080a0f;

      --card-dark: #10141d;

      --text-main: #ffffff;

    }



    * {

      box-sizing: border-box;

    }



    body {

      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

      background-color: var(--bg-dark);

      color: var(--text-main);

      text-align: center;

      margin: 0;

      padding: 10px;

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      touch-action: manipulation;

    }



    h1 {

      color: #00e676;

      font-size: clamp(1.8rem, 5vw, 3rem);

      margin: 10px 0 5px 0;

      text-shadow: 0 0 20px rgba(0, 230, 118, 0.6);

      letter-spacing: 1px;

    }



    p {

      color: #8b949e;

      font-size: clamp(0.9rem, 3vw, 1.25rem);

      margin-top: 0;

      margin-bottom: 15px;

    }



    .game-card {

      background: var(--card-dark);

      width: 100%;

      max-width: 1200px;

      padding: 20px 15px;

      border-radius: 20px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),

                  0 0 2px rgba(255, 255, 255, 0.1);

      border: 1px solid rgba(255, 255, 255, 0.08);

    }



    .controls-container {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;

      flex-wrap: wrap;

    }



    .btn-action {

      background: linear-gradient(135deg, #00e676, #009624);

      color: #0b0e14;

      border: none;

      padding: 12px 28px;

      font-size: clamp(1rem, 2.5vw, 1.25rem);

      font-weight: 800;

      border-radius: 50px;

      cursor: pointer;

      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);

      transition: all 0.2s ease;

    }



    .btn-action:hover {

      transform: translateY(-2px);

      box-shadow: 0 10px 25px rgba(0, 230, 118, 0.6);

    }



    .timer-display {

      font-size: clamp(1rem, 2.5vw, 1.5rem);

      font-weight: 800;

      background: rgba(0, 0, 0, 0.5);

      padding: 10px 20px;

      border-radius: 50px;

      border: 2px solid #00e676;

      color: #00e676;

      box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);

    }



    .timer-display.danger {

      color: #ff1744;

      border-color: #ff1744;

      box-shadow: 0 0 15px rgba(255, 23, 68, 0.4);

      animation: pulse 0.5s infinite alternate;

    }



    @keyframes pulse {

      from { transform: scale(1); }

      to { transform: scale(1.05); }

    }



    .items-container {

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 25px;

      min-height: 120px;

      padding: 15px;

      background: rgba(0, 0, 0, 0.4);

      border: 2px dashed rgba(0, 230, 118, 0.4);

      border-radius: 20px;

      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);

    }



    .draggable {

      padding: 10px 18px;

      background: linear-gradient(135deg, #1c2333, #151b26);

      color: #ffffff;

      border: 2px solid rgba(255, 255, 255, 0.2);

      border-radius: 50px;

      cursor: grab;

      font-size: clamp(0.9rem, 2vw, 1.1rem);

      font-weight: 800;

      user-select: none;

      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);

      transition: transform 0.2s ease, border-color 0.2s ease;

      touch-action: none;

      animation: fadeInCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    }



    @keyframes fadeInCard {

      from {

        opacity: 0;

        transform: translateY(15px) scale(0.95);

      }

      to {

        opacity: 1;

        transform: translateY(0) scale(1);

      }

    }



    .draggable.dragging-touch {

      position: fixed;

      z-index: 1000;

      pointer-events: none;

      transform: scale(1.1);

      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);

      border-color: #00e676;

    }



    .bins-container {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

    }



    .bin {

      width: clamp(100px, 18vw, 160px);

      height: clamp(130px, 22vw, 200px);

      border-radius: 16px;

      color: white;

      font-weight: bold;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: space-between;

      padding: 12px 6px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

      border: 2px solid rgba(255, 255, 255, 0.15);

      transition: all 0.2s ease;

      position: relative;

      overflow: hidden;

    }



    .bin.drag-over {

      transform: scale(1.08);

      filter: brightness(1.2);

    }



    .bin svg {

      width: clamp(35px, 8vw, 60px);

      height: clamp(35px, 8vw, 60px);

      fill: currentColor;

      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));

    }



    /* Animação da Tampa da Lixeira */

    .bin-lid {

      transform-origin: 19px 5px;

      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    }



    .bin.drag-over .bin-lid {

      transform: rotate(-15deg);

    }



    .bin.open-lid .bin-lid {

      transform: rotate(-55deg);

    }



    .bin-title {

      font-size: clamp(0.75rem, 2vw, 1.1rem);

      text-transform: uppercase;

      letter-spacing: 1px;

      font-weight: 900;

    }



    .bin[data-type="papel"] { background: linear-gradient(180deg, #0088cc, #005580); }

    .bin[data-type="plastico"] { background: linear-gradient(180deg, #d32f2f, #8e0000); }

    .bin[data-type="vidro"] { background: linear-gradient(180deg, #2e7d32, #1b5e20); }

    .bin[data-type="metal"] { background: linear-gradient(180deg, #fbc02d, #c79100); color: #0b0e14; }

    .bin[data-type="organico"] { background: linear-gradient(180deg, #ef6c00, #b23c00); }



    #message {

      margin-top: 20px;

      font-size: clamp(1rem, 2.5vw, 1.4rem);

      font-weight: 800;

      min-height: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0 10px;

    }



    .correct {

      color: var(--vidro);

      text-shadow: 0 0 12px rgba(0, 230, 118, 0.5);

      animation: popSuccess 0.4s ease-in-out;

    }



    .wrong {

      color: var(--plastico);

      text-shadow: 0 0 12px rgba(255, 23, 68, 0.5);

      animation: shakeError 0.4s ease-in-out;

    }



    @keyframes popSuccess {

      0% { transform: scale(1); }

      50% { transform: scale(1.06); }

      100% { transform: scale(1); }

    }



    @keyframes shakeError {

      0%, 100% { transform: translateX(0); }

      20%, 60% { transform: translateX(-10px); }

      40%, 80% { transform: translateX(10px); }

    }



    .qrcode-container {

      margin-top: 25px;

      padding: 15px;

      background: rgba(255, 255, 255, 0.05);

      border-radius: 12px;

      display: inline-block;

    }



    .qrcode-container img {

      border-radius: 8px;

      background: #ffffff;

      padding: 8px;

    }



    .qrcode-container span {

      display: block;

      margin-top: 8px;

      font-size: 0.85rem;

      color: #8b949e;

    }



    @media (max-width: 600px) {

      .game-card {

        padding: 15px 10px;

      }

      .bins-container {

        gap: 8px;

      }

    }

  </style>

</head>

    const itemsContainer = document.getElementById('itemsContainer');

    const message = document.getElementById('message');

    const btnStart = document.getElementById('btnStart');

    const timerDisplay = document.getElementById('timerDisplay');

    const bins = document.querySelectorAll('.bin');



    const TEMPO_INICIAL = 59; 

    let tempoRestante = TEMPO_INICIAL;

    let timerInterval = null;

    let jogoAtivo = false;



    function iniciarRodada() {

      clearInterval(timerInterval);

      tempoRestante = TEMPO_INICIAL;

      jogoAtivo = true;

      

      timerDisplay.classList.remove('danger');

      timerDisplay.textContent = `⏱️ Tempo: ${tempoRestante}s`;



      itemsContainer.innerHTML = '';

      message.textContent = '';

      message.className = '';

      btnStart.textContent = '🔄 Reiniciar Rodada (+10)';



      const itensSorteados = [...bancoDeDadosItens]

        .sort(() => Math.random() - 0.5)

        .slice(0, 10);



      itensSorteados.forEach((item, index) => {

        const div = document.createElement('div');

        div.className = 'draggable';

        div.draggable = true;

        div.id = `item-${Date.now()}-${index}`;

        div.setAttribute('data-type', item.tipo);

        div.textContent = `${item.emoji} ${item.nome}`;



        // Eventos para Computador (Mouse/Desktop)

        div.addEventListener('dragstart', (e) => {

          if (!jogoAtivo) {

            e.preventDefault();

            return;

          }

          e.dataTransfer.setData('text/plain', e.target.id);

        });



        // Eventos para Celular/Tablet (Touch)

        configurarEventosTouch(div);



        itemsContainer.appendChild(div);

      });



      timerInterval = setInterval(() => {

        tempoRestante--;

        timerDisplay.textContent = `⏱️ Tempo: ${tempoRestante}s`;



        if (tempoRestante <= 10) {

          timerDisplay.classList.add('danger');

        }



        if (tempoRestante <= 0) {

          clearInterval(timerInterval);

          jogoAtivo = false;

          message.textContent = "💥 Tempo esgotado! Clique em reiniciar para tentar de novo.";

          message.className = "wrong";

          itemsContainer.innerHTML = '';

        }

      }, 1000);

    }



    // Suporte ao Arrastar e Soltar via Mouse (Desktop)

      bin.addEventListener('dragover', (e) => {

        e.preventDefault();

        bin.classList.add('drag-over');

      });



      bin.addEventListener('dragleave', () => {

        bin.classList.remove('drag-over');

      });



      bin.addEventListener('drop', (e) => {

        e.preventDefault();

        bin.classList.remove('drag-over');

        if (!jogoAtivo) return;



        const id = e.dataTransfer.getData('text/plain');

        const draggedElement = document.getElementById(id);

        

        if (draggedElement) {

          validarJogada(draggedElement, bin);

        }

      });

    });



    // Função de Suporte Touch para Dispositivos Móveis

        if (!jogoAtivo) return;

        const touch = e.touches[0];

        

        element.classList.add('dragging-touch');

        element.style.left = `${touch.clientX - element.offsetWidth / 2}px`;

        element.style.top = `${touch.clientY - element.offsetHeight / 2}px`;

      }, { passive: false });



      element.addEventListener('touchmove', (e) => {

        if (!jogoAtivo) return;

        e.preventDefault(); // Evita rolagem da página ao arrastar

        const touch = e.touches[0];



        element.style.left = `${touch.clientX - element.offsetWidth / 2}px`;

        element.style.top = `${touch.clientY - element.offsetHeight / 2}px`;



        // Destacar lixeira abaixo do dedo

        const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);

        const binBelow = elementBelow ? elementBelow.closest('.bin') : null;



        bins.forEach(b => b.classList.remove('drag-over'));

        if (binBelow) {

          binBelow.classList.add('drag-over');

        }

      }, { passive: false });



      element.addEventListener('touchend', (e) => {

        if (!jogoAtivo) return;

        element.classList.remove('dragging-touch');

        element.style.left = '';

        element.style.top = '';



        const touch = e.changedTouches[0];

        const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);

        const binBelow = elementBelow ? elementBelow.closest('.bin') : null;



        bins.forEach(b => b.classList.remove('drag-over'));



        if (binBelow) {

          validarJogada(element, binBelow);

        }

      });

    }



    // Validação da Reciclagem

    function validarJogada(itemElem, binElem) {

      const itemType = itemElem.getAttribute('data-type');

      const binType = binElem.getAttribute('data-type');



      // Reseta classes de animação da mensagem para reativar o efeito

      message.className = '';

      void message.offsetWidth; 



      if (itemType === binType) {

        message.textContent = "✨ Excelente! Item reciclado corretamente!";

        message.className = "correct";

        

        // Ativa animação de abrir a tampa

        binElem.classList.add('open-lid');

        setTimeout(() => {

          binElem.classList.remove('open-lid');

        }, 500);



        itemElem.remove();

        verificarVitoria();

      } else {

        message.textContent = "❌ Lixeira incorreta! Tente novamente.";

        message.className = "wrong";

      }

    }



    function verificarVitoria() {

      if (itemsContainer.children.length === 0 && jogoAtivo) {

        clearInterval(timerInterval);

        jogoAtivo = false;

        message.textContent = `🏆 Incrível! Você reciclou tudo faltando ${tempoRestante}s!`;

        message.className = "correct";

      }

    }

  </script>
